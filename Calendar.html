<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <title>Reno Chess Club - Calendar</title>
  <style>
    /* One-screen layout: the calendar fills the space between header and buttons.
       The embedded Google Calendar scrolls inside its own frame; the page does not. */
    .calendar-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: var(--width-boxes);
      max-width: 1200px;
      margin: 0.5vh auto;
      padding: clamp(0.4rem, 1.5vh, 1.25rem);
      background-color: rgba(242, 242, 242, 0.95);
      border-radius: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .calendar-header {
      color: var(--primary-dark-color);
      margin-bottom: clamp(0.25rem, 1vh, 1rem);
      font-size: clamp(1.1rem, 3.5vh, 2rem);
      text-align: center;
      padding: 0;
    }

    .calendar-wrapper {
      flex: 1;
      min-height: 0;
      position: relative;
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 3px solid var(--accent-color);
    }

    .calendar-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .footer-buttons {
      display: flex;
      flex-shrink: 0;
      gap: 1rem;
      justify-content: center;
      width: var(--width-boxes);
      max-width: 600px;
      height: clamp(2.5rem, 6.5vh, 3.75rem);
      margin: 0.5vh auto;
    }

    .footer-buttons .button1,
    .footer-buttons .button2 {
      flex: 1;
    }
    .footer-buttons a {
      font-size: clamp(0.95rem, 2.4vh, 1.6rem);
      padding-top: 0;
      padding-bottom: 0;
    }
  </style>
</head>
<body>
<header>
    <h1><a class="return-home" href="index.html">Reno Chess Club</a></h1>
    <h2><a class="address" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=125+west+plumb+lane+reno+nv&oq=125+west+plumb+lane+reno+nv&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIKCAEQABiABBiiBDIKCAIQABiABBiiBDIHCAMQABjvBTIKCAQQABiABBiiBDIHCAUQABjvBdIBCDQ3NTlqMGo3qAIAsAIA&sourceid=chrome&ie=UTF-8&sei=ZRZjaYDNCYKtw8cPnNOJ8A0">125 West Plumb Lane</a></h2>
    <h2><a class="address" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=125+west+plumb+lane+reno+nv&oq=125+west+plumb+lane+reno+nv&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIKCAEQABiABBiiBDIKCAIQABiABBiiBDIHCAMQABjvBTIKCAQQABiABBiiBDIHCAUQABjvBdIBCDQ3NTlqMGo3qAIAsAIA&sourceid=chrome&ie=UTF-8&sei=ZRZjaYDNCYKtw8cPnNOJ8A0">Reno, Nevada 89502</a></h2>
    <h2 class="phone-number">775-355-1802</h2>
    <h2>Thursdays 5:30pm-Midnight</h2>
</header>

<div class="calendar-container">
    <h2 class="calendar-header">Club Calendar</h2>
    <div class="calendar-wrapper">
        <iframe
            src="https://calendar.google.com/calendar/embed?src=cd27ad33b083404ec8735fa857bbdef8cfee673fa8bdce75ee93d3417a708f7b%40group.calendar.google.com&ctz=America%2FLos_Angeles&mode=AGENDA"
            style="border: 0"
            frameborder="0"
            title="Reno Chess Club Calendar">
        </iframe>
    </div>
</div>

<div class="footer-buttons">

</html>
